AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Riallineamento massivo consensi CRM/Rex – Lambda Producer/Consumer (Python)

# ─── NOTE INFRASTRUTTURA ────────────────────────────────────────────────────────
# Le code SQS (crm-dmf-consent-queue / crm-dmf-consent-dlq) e i ruoli IAM
# (crm-dmf-consent-producer-role / crm-dmf-consent-consumer-role) sono già
# creati esternamente (Terraform). Questo template gestisce solo le Lambda.
# I security group Lambda sono in attesa da Terraform: passare l'ID tramite
# il parametro LambdaSecurityGroupId al momento del deploy SAM.
# ────────────────────────────────────────────────────────────────────────────────

Parameters:

  AuditBucket:
    Type: String
    Description: >
      Nome del bucket S3 per i file di audit (published, outcomes, summary, reconcile).
      Lifecycle consigliata: dettaglio (published/outcomes) 90gg, summary 1 anno.

  HermesBaseUrl:
    Type: String
    Default: "https://servizicollaudo.sky.it/hermes-st/v0"
    Description: >
      Base URL API Hermes.
      Collaudo: https://servizicollaudo.sky.it/hermes-st/v0
      Produzione: https://servizi.sky.it/hermes/v0

  HermesSecretName:
    Type: String
    Default: "prod/hermes/call-me-now"
    Description: >
      Nome secret Secrets Manager per le credenziali Hermes Basic Auth
      (chiavi: username, password). Usato solo quando attivato nel codice.

  HermesTimeoutMs:
    Type: String
    Default: "10000"
    Description: Timeout chiamata Hermes in millisecondi

  ConsumerBatchSize:
    Type: Number
    Default: 10
    Description: Messaggi SQS per batch consumer (max 10 per limite SQS)

  AlertEmail:
    Type: String
    Default: ""
    Description: Email per alert CloudWatch (opzionale – lasciare vuoto per saltare)

  RunId:
    Type: String
    Default: riallineamento-2026-09
    Description: >
      Identificativo della campagna. Chiave nella tabella audit.consent_realign_state
      e cartella di raggruppamento dell'audit su S3. Cambiarlo per avviare una
      campagna nuova partendo da zero.

  ProducerSchedule:
    Type: String
    Default: "rate(5 minutes)"
    Description: >
      Frequenza di riavvio del producer. Le invocazioni che si sovrappongono a una
      già in corso escono subito senza fare nulla (lock sulla tabella di stato),
      quindi un intervallo stretto non causa duplicati.

  ProducerScheduleEnabled:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >
      Lasciare false al deploy. Attivare solo quando la campagna deve partire,
      cioè dopo il refresh dati e la creazione dell'indice sulla tabella sorgente.

  MaxRecords:
    Type: String
    Default: "25"
    Description: >
      Tetto di record pubblicati per invocazione. 0 = nessun limite.
      Parte a 25 per il collaudo: si verifica l'esito su Hermes, poi si azzera
      per lasciar correre la campagna, che riprende dal record successivo.
      ATTENZIONE: tenere la schedulazione disattivata finché il limite è attivo,
      altrimenti il processo avanza 25 record ogni cinque minuti.

  LeaseSeconds:
    Type: String
    Default: "360"
    Description: >
      Durata del lock sul segnaposto, deve superare il timeout della Lambda (300s).
      Se un'invocazione muore senza rilasciare, il lock scade e la successiva riprende.

Globals:
  Function:
    Runtime: python3.14
    Architectures: [x86_64]
    MemorySize: 256

Resources:

  # ── Lambda producer ──────────────────────────────────────────────────────────
  ProducerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: crm-dmf-consent-producer
      CodeUri: producer/
      Handler: producer.handler
      Timeout: 300   # 5 minuti
      MemorySize: 512
      Description: Legge RDS HOT a pagine e pubblica su SQS, riprendendo dal segnaposto
      Environment:
        Variables:
          DB_SECRET_NAME: prod/dmf/db/hot
          DB_HOST: sky-dmf-prod-hot-db.cvmeoqosyucw.eu-west-1.rds.amazonaws.com
          DB_PORT: "6543"
          DB_NAME: sky-dmf-prod-hot-db
          DB_SCHEMA: audit
          DB_TABLE: audit_sky_recs_recommendation
          SQS_QUEUE_URL: https://sqs.eu-west-1.amazonaws.com/654654357496/crm-dmf-consent-queue
          PAGE_SIZE: "500"
          AUDIT_BUCKET: !Ref AuditBucket
          RUN_ID: !Ref RunId
          LEASE_SECONDS: !Ref LeaseSeconds
          MAX_RECORDS: !Ref MaxRecords
      Events:
        ScheduledRun:
          Type: Schedule
          Properties:
            Name: crm-dmf-consent-producer-schedule
            Schedule: !Ref ProducerSchedule
            Enabled: !Ref ProducerScheduleEnabled
            Description: >
              Rilancia il producer finché la campagna non è completa. Quando lo stato
              passa a 'completed' le invocazioni successive escono immediatamente.

  # ── Lambda consumer ──────────────────────────────────────────────────────────
  ConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: crm-dmf-consent-consumer
      CodeUri: consumer/
      Handler: consumer.handler
      Timeout: 30
      Description: Legge SQS e chiama Hermes MDW per opt-in/opt-out
      Environment:
        Variables:
          HERMES_BASE_URL: !Ref HermesBaseUrl
          HERMES_SECRET_NAME: !Ref HermesSecretName
          HERMES_TIMEOUT_MS: !Ref HermesTimeoutMs
          AUDIT_BUCKET: !Ref AuditBucket
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: arn:aws:sqs:eu-west-1:654654357496:crm-dmf-consent-queue
            BatchSize: !Ref ConsumerBatchSize
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # ── CloudWatch alarm DLQ ─────────────────────────────────────────────────────
  DLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: crm-dmf-consent-dlq-not-empty
      AlarmDescription: Messaggi in DLQ – analizzare CloudWatch Logs e avviare redrive
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: crm-dmf-consent-dlq
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ConsumerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: crm-dmf-consent-consumer-errors
      AlarmDescription: "Errori Lambda consumer > 100 in 5 min – verificare disponibilità Hermes"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ConsumerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ConsumerDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: crm-dmf-consent-consumer-duration
      AlarmDescription: "p95 duration Lambda consumer > 25s – possibile timeout Hermes"
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref ConsumerFunction
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 1
      Threshold: 25000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # ── Lambda reconciler ───────────────────────────────────────────────────────
  ReconcilerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: crm-dmf-consent-reconciler
      CodeUri: reconciler/
      Handler: reconciler.handler
      Timeout: 300   # 5 minuti — può leggere molti file S3
      Description: >
        Legge gli outcome S3 di un run, ri-pubblica su SQS i soli errori retryable
        (timeout/502/503/504) e scrive un report per quelli non recuperabili.
      Environment:
        Variables:
          AUDIT_BUCKET: !Ref AuditBucket
          SQS_QUEUE_URL: https://sqs.eu-west-1.amazonaws.com/654654357496/crm-dmf-consent-queue

Outputs:
  ProducerFunctionArn:
    Description: ARN Lambda producer
    Value: !GetAtt ProducerFunction.Arn

  ConsumerFunctionArn:
    Description: ARN Lambda consumer
    Value: !GetAtt ConsumerFunction.Arn
